<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taxi Booking Form</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .booking-form {
      background: #fff;
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      padding: 25px 30px;
    }

    .booking-form h2 {
      text-align: center;
      color: #222;
      margin-bottom: 20px;
    }

    label {
      font-weight: 600;
      color: #333;
      margin-top: 10px;
      display: block;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      font-size: 15px;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #007bff;
    }

    .form-group {
      margin-bottom: 15px;
    }

    button {
      background: #007bff;
      color: #fff;
      border: none;
      padding: 12px 20px;
      width: 100%;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #0056b3;
    }

    .map-container {
      margin-top: 15px;
      border-radius: 8px;
      overflow: hidden;
      height: 250px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <form class="booking-form">
    <h2>Taxi Booking Form 🚕</h2>

    <div class="form-group">
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required />
    </div>

    <div class="form-group">
      <label for="mobile">Mobile Number:</label>
      <input type="tel" id="mobile" name="mobile" placeholder="Enter your mobile number" required />
    </div>

    <div class="form-group">
      <label for="location">Pick Up:</label>
      <input type="text" id="location" name="location" placeholder="Enter your current location" required />
    </div>

    <div class="form-group">
      <label for="pickup">Pick-up Date:</label>
      <input type="date" id="pickup" name="pickup" required />
    </div>

    <div class="form-group">
      <label for="drop">Drop Date :</label>
      <input type="date" id="drop" name="drop" required />
    </div>

    <div class="form-group">
      <label for="destination">Destination:</label>
      <input type="text" id="destination" name="destination" placeholder="Enter your drop location" required />
    </div>

    <div class="form-group">
      <label for="notes">Additional Notes (Optional):</label>
      <textarea id="notes" name="notes" rows="3" placeholder="Any special requests..."></textarea>
    </div>

    <button type="submit"  onclick="whatsapp()"  value="send details" >Book Now</button>
    


  
    </div>
  </form>
 <script src="whatsapp.js"></script>
</body>
</html>
